<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview rate by source chart</title>
<style>
  :root {
    --text: #2a2a28; --rule: #e4e4e0; --label: #55554f;
    --main: #d02c2b; --secondary: #141414; --tertiary: #ac1a1c; --highlight: #ffe6e2;
    --sans: "Public Sans", sans-serif; --mono: "JetBrains Mono", monospace;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; }
  body { color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  #chart { position: relative; width: 100%; height: 100%; min-height: 240px; }
  #chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .cat { font: 400 13px var(--sans); fill: var(--label); }
  .cat.hl { font-weight: 600; fill: var(--text); }
  .val { font: 500 12px var(--mono); fill: var(--text); }
  .val.hl { fill: var(--main); }
  .tick { font: 400 11px var(--mono); fill: var(--label); }
  .bar { transition: fill 120ms, stroke-width 120ms; }
  .bar.hl { fill: var(--main); }
  .bar.base { fill: var(--highlight); stroke: var(--tertiary); stroke-width: 1; }
  .row { outline: none; cursor: default; }
  .row:hover .bar.hl, .row:focus .bar.hl, .row.active .bar.hl { fill: var(--tertiary); }
  .row:hover .bar.base, .row:focus .bar.base, .row.active .bar.base { stroke-width: 2; }
  .row:focus-visible .hit { stroke: var(--main); stroke-width: 2; }
  .hit { fill: transparent; }
  #tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity 120ms;
    background: var(--secondary); color: #f7f7f5; border-radius: 8px; padding: 8px 10px;
    font: 400 12px/1.4 var(--sans); max-width: 240px; z-index: 2;
  }
  #tip .n { display: block; font: 500 15px var(--mono); color: #ffffff; }
  #tip .s { display: block; font: 400 10.5px/1.45 var(--mono); color: #d8d8d2; margin-top: 3px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div id="chart" role="group" aria-label="Bar chart. Share of applicants who reached an interview, by source: agency 42%, internal 42%, referral 40%, sourced 25%, inbound online applications 3%."></div>
<div id="tip" role="status" aria-live="polite"></div>

<table class="sr-only">
  <caption>Share of applicants who reach an interview, by source (Ashby, 38M+ applications across 93K jobs, 2021–2024)</caption>
  <thead><tr><th scope="col">Source</th><th scope="col">Reached an interview</th><th scope="col">Share of all applications</th></tr></thead>
  <tbody>
    <tr><td>Agency</td><td>42%</td><td>0.4%</td></tr>
    <tr><td>Internal</td><td>42%</td><td>0.05%</td></tr>
    <tr><td>Referral</td><td>40%</td><td>1%</td></tr>
    <tr><td>Sourced (recruiter outreach)</td><td>25%</td><td>4.8%</td></tr>
    <tr><td>Inbound (online application)</td><td>3%</td><td>93.8%</td></tr>
  </tbody>
</table>

<script>
(function () {
  var data = [
    { label: "Agency", v: 42, share: "0.4%", hl: false },
    { label: "Internal", v: 42, share: "0.05%", hl: false },
    { label: "Referral", v: 40, share: "1%", hl: false },
    { label: "Sourced (recruiter outreach)", v: 25, share: "4.8%", hl: false },
    { label: "Inbound (online application)", v: 3, share: "93.8%", hl: true }
  ];
  var MAX = 50, TICKS = [0, 10, 20, 30, 40, 50];
  var NS = "http://www.w3.org/2000/svg";
  var root = document.getElementById("chart"), tip = document.getElementById("tip");

  function el(name, attrs, parent, text) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  }
  // horizontal bar: square at the baseline, 4px rounded at the data end
  function barPath(x, y, w, h) {
    var r = Math.min(4, w / 2, h / 2);
    return "M" + x + "," + y + "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
           "V" + (y + h - r) + "Q" + (x + w) + "," + (y + h) + " " + (x + w - r) + "," + (y + h) + "H" + x + "Z";
  }

  function showTip(d, rowEl) {
    tip.innerHTML = "<span>" + d.label + "</span><span class=\"n\">" + d.v + "% reached an interview</span>" +
      "<span class=\"s\">" + d.share + " of all applications came from this source<br>Ashby, 38M+ applications, 2021–2024</span>";
    var box = root.getBoundingClientRect(), r = rowEl.querySelector(".bar").getBoundingClientRect();
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    if (box.width < 520) {                                  // narrow: above the row, else below the bar
      var rowTop = rowEl.querySelector(".hit").getBoundingClientRect().top - box.top;
      var ny = rowTop - th - 4;
      if (ny < 0) ny = r.bottom - box.top + 10;
      tip.style.left = Math.max(0, Math.min(r.left - box.left, box.width - tw)) + "px";
      tip.style.top = ny + "px"; tip.style.opacity = 1;
      return;
    }
    var x = r.right - box.left + 48;                       // to the right of the value label
    if (x + tw > box.width) x = Math.max(0, r.left - box.left + 8);
    x = Math.min(x, box.width - tw);
    var y = r.top - box.top + r.height / 2 - th / 2;
    if (x < r.right - box.left + 40) y = r.bottom - box.top + 10;   // no room beside: drop below the bar
    if (y + th > box.height) y = r.top - box.top - th - 10;
    tip.style.left = Math.max(0, x) + "px"; tip.style.top = Math.max(0, y) + "px"; tip.style.opacity = 1;
  }
  function hideTip() { tip.style.opacity = 0; }

  function draw() {
    root.innerHTML = "";
    var W = root.clientWidth, H = Math.max(root.clientHeight, 240);
    var narrow = W < 520;                 // labels above bars on small screens
    var labelW = narrow ? 0 : Math.min(230, W * 0.36);
    var valW = 44, axisH = 24;
    var plotX = labelW + (narrow ? 0 : 12), plotW = Math.max(W - plotX - valW, 60);
    var rowH = (H - axisH) / data.length;
    var barH = Math.max(10, Math.min(20, rowH * (narrow ? 0.32 : 0.42)));
    var X = function (v) { return plotX + plotW * v / MAX; };
    var svg = el("svg", { viewBox: "0 0 " + W + " " + H }, root);

    TICKS.forEach(function (t) {
      el("line", { x1: X(t), y1: 0, x2: X(t), y2: H - axisH, stroke: "#e4e4e0", "stroke-width": 1 }, svg);
      el("text", { x: X(t), y: H - 6, "text-anchor": t === 0 && narrow ? "start" : "middle", class: "tick" }, svg, t + "%");
    });

    data.forEach(function (d, i) {
      var y0 = i * rowH;
      var by = narrow ? y0 + rowH - barH - rowH * 0.18 : y0 + (rowH - barH) / 2;
      var g = el("g", { class: "row", tabindex: 0, role: "img", "aria-label": d.label + ": " + d.v + "% reached an interview" }, svg);
      el("rect", { class: "hit", x: 0, y: y0 + 1, width: W, height: rowH - 2, rx: 6 }, g);
      if (narrow) el("text", { x: plotX, y: by - 7, class: "cat" + (d.hl ? " hl" : "") }, g, d.label);
      else el("text", { x: labelW, y: by + barH / 2 + 4.5, "text-anchor": "end", class: "cat" + (d.hl ? " hl" : "") }, g, d.label);
      var w = Math.max(X(d.v) - plotX, 3);
      el("path", { d: barPath(plotX, by, w, barH), class: "bar " + (d.hl ? "hl" : "base") }, g);
      el("text", { x: plotX + w + 8, y: by + barH / 2 + 4.5, class: "val" + (d.hl ? " hl" : "") }, g, d.v + "%");
      var on = function () { showTip(d, g); g.classList.add("active"); };
      var off = function () { hideTip(); g.classList.remove("active"); };
      g.addEventListener("pointerenter", on);
      g.addEventListener("pointerleave", off);
      g.addEventListener("pointerdown", on);     // touch: tap to show
      g.addEventListener("focus", on);
      g.addEventListener("blur", off);
    });
  }

  draw();
  var t;
  function redraw() { clearTimeout(t); t = setTimeout(draw, 80); }
  window.addEventListener("resize", redraw);
  if (window.ResizeObserver) new ResizeObserver(redraw).observe(root);
})();
</script>
</body>
</html>
